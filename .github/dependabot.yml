version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    assignees:
      - markheydon
    labels:
      - type/chore
      - status/todo
      - priority/medium
    ignore:
      # Microsoft.OpenApi 3.x is not compatible with ASP.NET Core 10; stay on 2.x until a future ASP.NET release.
      - dependency-name: Microsoft.OpenApi
        update-types:
          - version-update:semver-major
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
      tests:
        patterns:
          - "^xunit"
          - "^Moq"
          - "Microsoft\\.NET\\.Test\\.Sdk"
          - "^Microsoft\\.Testing"
          - "^coverlet"
        update-types:
          - minor
          - patch
      microsoft-extensions:
        patterns:
          - "^Microsoft\\.Extensions\\."
        update-types:
          - minor
          - patch
      azure:
        patterns:
          - "^Azure\\."
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - "^OpenTelemetry\\."
        update-types:
          - minor
          - patch
      analyzers:
        patterns:
          - "Analyzer$"
          - "^Microsoft\\.CodeAnalysis"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    assignees:
      - markheydon
    labels:
      - type/chore
      - status/todo
      - priority/medium
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
